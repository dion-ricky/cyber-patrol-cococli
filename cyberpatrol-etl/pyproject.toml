[project]
name = "cyberpatrol-etl"
version = "0.1.0"
description = "Incremental extract/load from Snowflake Postgres into Snowflake tables, deployed as an SPCS job"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2.0",
    "snowflake-connector-python[pandas]>=3.12.0",
    "pandas>=2.2.0",
]

[dependency-groups]
dev = [
    "ruff>=0.12.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
